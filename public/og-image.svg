<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Starfield effect -->
    <radialGradient id="starfield" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#0a0f1f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </radialGradient>
    
    <!-- Text gradient -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fcd34d;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#starfield)"/>
  
  <!-- Stars pattern -->
  <circle cx="100" cy="100" r="2" fill="#fbbf24" opacity="0.6"/>
  <circle cx="300" cy="80" r="1.5" fill="#fbbf24" opacity="0.4"/>
  <circle cx="500" cy="120" r="1" fill="#ffffff" opacity="0.8"/>
  <circle cx="700" cy="90" r="2" fill="#fbbf24" opacity="0.5"/>
  <circle cx="900" cy="110" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="1050" cy="95" r="1" fill="#fbbf24" opacity="0.7"/>
  
  <circle cx="150" cy="300" r="1" fill="#ffffff" opacity="0.5"/>
  <circle cx="350" cy="280" r="2" fill="#fbbf24" opacity="0.6"/>
  <circle cx="550" cy="320" r="1.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="750" cy="290" r="1" fill="#fbbf24" opacity="0.4"/>
  <circle cx="950" cy="310" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="1100" cy="295" r="1.5" fill="#fbbf24" opacity="0.5"/>
  
  <circle cx="200" cy="500" r="2" fill="#fbbf24" opacity="0.7"/>
  <circle cx="400" cy="480" r="1" fill="#ffffff" opacity="0.5"/>
  <circle cx="600" cy="520" r="1.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="800" cy="490" r="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="1000" cy="510" r="1" fill="#fbbf24" opacity="0.4"/>
  <circle cx="1150" cy="495" r="1.5" fill="#ffffff" opacity="0.6"/>
  
  <!-- Mystical symbol (simplified star) -->
  <g transform="translate(600, 230)">
    <polygon points="0,-40 10,-15 40,-15 15,5 25,35 0,15 -25,35 -15,5 -40,-15 -10,-15" 
             fill="none" 
             stroke="#fbbf24" 
             stroke-width="2" 
             opacity="0.3"/>
  </g>
  
  <!-- Dark overlay for text readability -->
  <rect width="1200" height="200" y="215" fill="#0a0f1f" opacity="0.85"/>
  
  <!-- Brand name -->
  <text x="600" y="320" 
        font-family="Georgia, serif" 
        font-size="80" 
        font-weight="bold"
        fill="url(#textGradient)" 
        text-anchor="middle"
        letter-spacing="2">
    FutureSeer
  </text>
  
  <!-- Tagline -->
  <text x="600" y="365" 
        font-family="Georgia, serif" 
        font-size="28" 
        fill="#fbbf24" 
        text-anchor="middle"
        opacity="0.9">
    AI-Powered Mystical Insights
  </text>
  
  <!-- Subtle bottom text -->
  <text x="600" y="580" 
        font-family="Arial, sans-serif" 
        font-size="16" 
        fill="#fbbf24" 
        text-anchor="middle"
        opacity="0.6">
    Where Ancient Wisdom Meets Artificial Intelligence
  </text>
</svg>