name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Cron is UTC. Daily health check at 04:00 UTC (off-peak for many regions vs business hours).
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security_scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # gitleaks-action calls the Pull Requests API on pull_request events; repo default
    # workflow token is often contents-read-only → 403 without explicit pull-requests: read.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit + security lint
        run: pnpm run security

      - name: Ensure full git history for gitleaks range scan
        shell: bash
        run: |
          git fetch --prune --unshallow || true

      # Pin GITLEAKS_VERSION: default action bundle (~8.24.x) does not honor .gitleaksignore the same as 8.30.x.
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_COMMENTS: "false"

      - name: Gitleaks remediation note (for reviewers)
        if: success()
        shell: bash
        run: |
          echo "Gitleaks passed. Historical matches are allowlisted in .gitleaksignore only by fingerprint."
          echo "Firebase Admin private keys from old commits were revoked in IAM; runtime uses current env credentials."
          echo "Remaining allowlisted items are public (reCAPTCHA site keys), templates, or non-secret strings — not live API secrets."

      - name: Upload gitleaks SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results.sarif
          path: results.sarif
          if-no-files-found: warn

  lint_test:
    name: Lint + Jest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint changed files
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            HEAD_SHA="${{ github.sha }}"
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              BASE_SHA="$(git rev-parse HEAD~1)"
            else
              BASE_SHA="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
            fi
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          # Schedule (and some push edge cases) omit github.event.before; do not fall back to the
          # repo root commit — that diffs the entire tree and lints thousands of unrelated files.
          if [[ -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
            if [[ -z "$DEFAULT_BRANCH" ]]; then
              DEFAULT_BRANCH="main"
            fi
            git fetch origin "$DEFAULT_BRANCH" 2>/dev/null || git fetch origin
            if git rev-parse "origin/$DEFAULT_BRANCH" >/dev/null 2>&1; then
              BASE_SHA="$(git rev-parse "origin/$DEFAULT_BRANCH")"
            else
              BASE_SHA="$HEAD_SHA"
            fi
          fi

          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" | grep -E '\.(js|jsx|ts|tsx)$' | grep -Ev '^jest\.config\.js$' || true)

          if [[ -z "$CHANGED_FILES" ]]; then
            echo "No JS/TS files changed; skipping lint."
            exit 0
          fi

          echo "Linting changed files:"
          echo "$CHANGED_FILES"
          # shellcheck disable=SC2086
          pnpm exec eslint $CHANGED_FILES

      - name: Jest tests
        run: pnpm test

  linux_desktop_smoke:
    name: Linux desktop smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint_test]
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm run build

      - name: Linux desktop launch smoke
        shell: bash
        continue-on-error: true
        env:
          ELECTRON_NO_SANDBOX: "1"
          ELECTRON_EXIT_AFTER_MS: "5000"
        run: |
          pnpm run start &
          NEXT_PID=$!
          trap "kill $NEXT_PID" EXIT
          pnpm exec wait-on http://localhost:3000
          xvfb-run --auto-servernum pnpm run electron

  linux_readiness_audit:
    name: Linux readiness audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [lint_test]
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linux readiness audit
        id: readiness
        shell: bash
        continue-on-error: true
        env:
          LINUX_READINESS_SUMMARY_PATH: artifacts/linux-readiness-summary.md
          LINUX_READINESS_SUMMARY_JSON_PATH: artifacts/linux-readiness-summary.json
        run: |
          pnpm run linux:readiness
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload Linux readiness summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-readiness-summary
          path: |
            artifacts/linux-readiness-summary.md
            artifacts/linux-readiness-summary.json
          if-no-files-found: warn

      - name: Fail when readiness check fails
        if: always() && steps.readiness.outputs.exit_code != '0'
        run: |
          echo "Linux readiness audit failed. See linux-readiness-summary artifact."
          exit 1

  e2e_smoke:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [security_scan, lint_test]
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      - name: Run Playwright CI script
        run: pnpm run test:e2e:ci

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

