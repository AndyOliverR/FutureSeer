name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Cron is UTC. Daily health check at 04:00 UTC (off-peak for many regions vs business hours).
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint_test:
    name: Lint + Jest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint changed files
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            HEAD_SHA="${{ github.sha }}"
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              BASE_SHA="$(git rev-parse HEAD~1)"
            else
              BASE_SHA="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
            fi
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          # Schedule (and some push edge cases) omit github.event.before; do not fall back to the
          # repo root commit — that diffs the entire tree and lints thousands of unrelated files.
          if [[ -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
            if [[ -z "$DEFAULT_BRANCH" ]]; then
              DEFAULT_BRANCH="main"
            fi
            git fetch origin "$DEFAULT_BRANCH" 2>/dev/null || git fetch origin
            if git rev-parse "origin/$DEFAULT_BRANCH" >/dev/null 2>&1; then
              BASE_SHA="$(git rev-parse "origin/$DEFAULT_BRANCH")"
            else
              BASE_SHA="$HEAD_SHA"
            fi
          fi

          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" | grep -E '\.(js|jsx|ts|tsx)$' | grep -Ev '^jest\.config\.js$' || true)

          if [[ -z "$CHANGED_FILES" ]]; then
            echo "No JS/TS files changed; skipping lint."
            exit 0
          fi

          echo "Linting changed files:"
          echo "$CHANGED_FILES"
          # shellcheck disable=SC2086
          pnpm exec eslint $CHANGED_FILES

      - name: Jest tests
        run: pnpm test

  e2e_smoke:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint_test
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Playwright CI script
        run: pnpm run test:e2e:ci

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

