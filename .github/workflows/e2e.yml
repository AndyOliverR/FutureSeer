# E2E tests in real browser (Playwright) on every PR.
# Same idea as Canary: real user flows tested before merge.
name: E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.28.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (Chromium)
        run: pnpm exec playwright install chromium --with-deps

      - name: Build app
        run: DISABLE_WEBPACK_CACHE=1 pnpm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Start server and run E2E
        run: |
          pnpm start &
          npx wait-on -t 120 http://localhost:3000
          pnpm run test:e2e
        env:
          CI: 'true'

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
