# Hobby-safe replacement for Vercel cron `*/5` (not allowed on Vercel Hobby).
# Scans generationJobs for queued / failed / stale Stage B work and resumes processing.
#
# REQUIRED once (stops scheduled failures):
#   1. Vercel → future-seer → Settings → Environment Variables → CRON_SECRET (Production) → copy value
#   2. GitHub → AndyOliverR/FutureSeer → Settings → Secrets and variables → Actions
#      → New repository secret → Name: CRON_SECRET → paste same value
#   3. Actions → Mystical Stage B recovery → Run workflow (manual test)
#
# Optional variable: CRON_BASE_URL (default https://futureseer.app)

name: Mystical Stage B recovery

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: mystical-stage-b-cron
  cancel-in-progress: false

jobs:
  trigger:
    name: Resume stale Stage B jobs
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call Stage B cron endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CRON_BASE_URL: ${{ vars.CRON_BASE_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              echo "::error::Add CRON_SECRET to GitHub Actions secrets (same value as Vercel production CRON_SECRET)."
              echo "Vercel: Project → Settings → Environment Variables → CRON_SECRET"
              echo "GitHub: Repository → Settings → Secrets and variables → Actions → New repository secret"
              exit 1
            fi
            echo "CRON_SECRET not configured — skipping scheduled run."
            exit 0
          fi
          base="${CRON_BASE_URL:-https://futureseer.app}"
          base="${base%/}"
          url="${base}/api/cron/mystical-stage-b"
          echo "GET ${url}"
          http_code=$(curl -sS --max-time 90 -o /tmp/stage-b-cron.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${url}")
          cat /tmp/stage-b-cron.json
          echo ""
          echo "HTTP ${http_code}"
          if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
            exit 1
          fi
